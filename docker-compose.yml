# Production stack: the app + Caddy (automatic HTTPS for aacartraders.com).
# Usage: see DEPLOY.md
services:
  app:
    build: .
    restart: unless-stopped
    env_file: ./deploy/.env.production
    volumes:
      - app_data:/data          # database + uploaded product photos/videos
    expose:
      - "8000"

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  app_data:
  caddy_data:
  caddy_config:
